<p-toast position="top-right" />

<div class="admin-shell">
  <aside class="admin-sidebar">
    <ng-container *ngTemplateOutlet="panel"></ng-container>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <p-button icon="pi pi-bars" [text]="true" (onClick)="toggleMenu()" ariaLabel="Abrir menú" />
      <span class="admin-brand-name">Ali-Vet</span>
    </header>
    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<p-drawer [visible]="menuOpen" (visibleChange)="menuOpen = $event" [showCloseIcon]="true" header="Ali-Vet" [style]="{ width: '18rem' }">
  <ng-container *ngTemplateOutlet="panel"></ng-container>
</p-drawer>

<ng-template #panel>
  <div class="admin-panel">
    <div class="admin-brand">
      <span class="admin-brand-mark" aria-hidden="true">A</span>
      <div>
        <p class="admin-brand-name">Ali-Vet</p>
        <p class="admin-brand-caption">Panel de gestión</p>
      </div>
    </div>

    <nav class="admin-nav" aria-label="Navegación del panel">
      @for (section of menu; track section.label) {
        <p class="admin-nav-label">{{ section.label }}</p>
        @for (link of section.links; track link.path) {
          <a
            class="admin-nav-link"
            [routerLink]="link.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
            (click)="closeMenu()"
          >
            <i [class]="link.icon" aria-hidden="true"></i>
            <span>{{ link.label }}</span>
          </a>
        }
      }
    </nav>

    <div class="admin-user">
      <p-avatar [label]="(user?.nombre ?? 'A').charAt(0).toUpperCase()" shape="circle" />
      <div class="admin-user-text">
        <p class="admin-user-name">{{ user?.nombre ?? 'Administrador' }}</p>
        <p class="admin-user-email">{{ user?.email }}</p>
      </div>
      <p-button icon="pi pi-sign-out" [text]="true" [rounded]="true" (onClick)="logout()" ariaLabel="Cerrar sesión" />
    </div>
  </div>
</ng-template>
