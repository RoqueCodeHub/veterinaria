<div class="admin-page" [class.menu-open]="menuOpen">

    <header class="admin-topbar">
        <button type="button" class="menu-btn" (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen" aria-controls="menu-admin"
            [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'">
            @if (menuOpen) {
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
            } @else {
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            }
        </button>
        <span>Ali-Vet</span>
    </header>

    @if (menuOpen) {
    <button type="button" class="sidebar-backdrop" (click)="closeMenu()" aria-label="Cerrar menú"></button>
    }

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="menu-admin">

        <div class="sidebar-brand">
            <div class="brand-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <span>Ali-Vet</span>
        </div>

        <nav class="sidebar-nav">

            <ng-container *ngFor="let link of menu">
                <a [routerLink]="link.path" routerLinkActive="active"
                    [routerLinkActiveOptions]="{exact: link.exact ?? false}" class="nav-item"
                    (click)="closeMenu()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="link.icon" />
                    </svg>
                    <span>{{ link.label }}</span>
                </a>
            </ng-container>

        </nav>

        <button type="button" class="theme-toggle" (click)="theme.toggle()"
            [attr.aria-label]="theme.theme() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
            [title]="theme.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro'">
            @if (theme.theme() === 'dark') {
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            } @else {
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
            }
            <span>{{ theme.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro' }}</span>
        </button>

        <!-- Usuario activo -->
        <div class="sidebar-user">
            <div class="sidebar-user-avatar">
                {{ (user?.nombre ?? 'A').charAt(0).toUpperCase() }}
            </div>
            <div class="sidebar-user-info">
                <p class="sidebar-user-name">{{ user?.nombre ?? 'Administrador' }}</p>
                <p class="sidebar-user-email">{{ user?.email }}</p>
            </div>
        </div>

        <button class="sidebar-logout" (click)="logout()">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <span>Cerrar Sesión</span>
        </button>

    </aside>

    <!-- ===== CONTENT ===== -->
    <main class="admin-content">
        <router-outlet></router-outlet>
    </main>

</div>
