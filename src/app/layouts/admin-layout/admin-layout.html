<div class="admin-page">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">

        <div class="sidebar-brand">
            <div class="brand-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <span>Ali-Vet</span>
        </div>

        <nav class="sidebar-nav">

            <ng-container *ngFor="let link of navLinks">
                <a [routerLink]="link.path" routerLinkActive="active"
                    [routerLinkActiveOptions]="{exact: link.exact ?? false}" class="nav-item">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="link.icon" />
                    </svg>
                    <span>{{ link.label }}</span>
                </a>
            </ng-container>

        </nav>

        <!-- Usuario activo -->
        <div class="sidebar-user">
            <div class="sidebar-user-avatar">
                {{ (user?.nombre ?? 'A').charAt(0).toUpperCase() }}
            </div>
            <div class="sidebar-user-info">
                <p class="sidebar-user-name">{{ user?.nombre ?? 'Administrador' }}</p>
                <p class="sidebar-user-email">{{ user?.email }}</p>
            </div>
        </div>

        <button class="sidebar-logout" (click)="logout()">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <span>Cerrar Sesión</span>
        </button>

    </aside>

    <!-- ===== CONTENT ===== -->
    <main class="admin-content">
        <router-outlet></router-outlet>
    </main>

</div>
