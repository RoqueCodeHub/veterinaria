<p-toast position="top-right" />

<div class="admin-shell">
  <aside class="admin-sidebar">
    <ng-container *ngTemplateOutlet="panel"></ng-container>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <p-button icon="pi pi-bars" [text]="true" (onClick)="toggleMenu()" ariaLabel="Abrir menú" />
      <span class="admin-brand-name">Ali-Vet</span>
    </header>
    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<p-drawer [visible]="menuOpen" (visibleChange)="menuOpen = $event" [showCloseIcon]="true" header="Ali-Vet" [style]="{ width: '18rem' }">
  <ng-container *ngTemplateOutlet="panel"></ng-container>
</p-drawer>

<ng-template #panel>
  <div class="admin-panel">
    <div class="admin-brand">
      <span class="admin-brand-mark" aria-hidden="true">A</span>
      <div>
        <p class="admin-brand-name">Ali-Vet</p>
        <p class="admin-brand-caption">Panel de gestión</p>
      </div>
    </div>

    <nav class="admin-nav" aria-label="Navegación del panel">
      @for (section of menu; track section.label) {
        <p class="admin-nav-label">{{ section.label }}</p>
        @for (link of section.links; track link.path) {
          <a
            class="admin-nav-link"
            [routerLink]="link.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
            (click)="closeMenu()"
          >
            <i [class]="link.icon" aria-hidden="true"></i>
            <span>{{ link.label }}</span>
          </a>
        }
      }
    </nav>

    <div class="admin-user">
      <p-avatar [label]="(user?.name ?? 'A').charAt(0).toUpperCase()" shape="circle" />
      <div class="admin-user-text">
        <p class="admin-user-name">{{ user?.name ?? 'Administrador' }}</p>
        <p class="admin-user-email">{{ user?.email }}</p>
      </div>
      <p-button icon="pi pi-key" [text]="true" [rounded]="true" (onClick)="openPassword()" ariaLabel="Cambiar contraseña" />
      <p-button icon="pi pi-sign-out" [text]="true" [rounded]="true" (onClick)="logout()" ariaLabel="Cerrar sesión" />
    </div>
  </div>
</ng-template>

<p-dialog header="Cambiar contraseña" [visible]="passwordOpen()" (visibleChange)="passwordOpen.set($event)" [modal]="true" [style]="{ width: '26rem' }">
  <form class="grid gap-3" (ngSubmit)="savePassword()">
    @if (passwordError()) { <p class="list-error">{{ passwordError() }}</p> }
    <label class="flex flex-col gap-1">Contraseña actual
      <input pInputText type="password" [(ngModel)]="passwordForm.current" name="current" />
    </label>
    <label class="flex flex-col gap-1">Nueva contraseña
      <input pInputText type="password" [(ngModel)]="passwordForm.next" name="next" />
    </label>
    <label class="flex flex-col gap-1">Confirmar
      <input pInputText type="password" [(ngModel)]="passwordForm.confirm" name="confirm" />
    </label>
    <div class="flex justify-end gap-2">
      <p-button type="button" label="Cancelar" [outlined]="true" (onClick)="passwordOpen.set(false)" />
      <p-button type="submit" label="Guardar" [disabled]="savingPassword()" />
    </div>
  </form>
</p-dialog>
