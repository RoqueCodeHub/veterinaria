<p-dialog header="Ticket" [visible]="visible()" (visibleChange)="visible.set($event)" [modal]="true" [style]="{ width: '32rem' }">
  @if (cargando()) {
    <p class="ticket-wait">Preparando el ticket...</p>
  } @else if (url(); as src) {
    <iframe class="ticket-frame" [src]="src" title="Ticket"></iframe>
  }
  <div class="ticket-actions"><ng-content /></div>
</p-dialog>
