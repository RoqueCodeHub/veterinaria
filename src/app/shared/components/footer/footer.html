<footer class="alivet-footer border-t border-primary/10">

    <p class="m-0 text-sm text-muted">
      © {{ currentYear }} Veterinaria Alivet · RUC 20611213175 · E.I.R.L. · Iberia, Madre de Dios
    </p>
    <nav class="flex flex-wrap gap-4" aria-label="Información legal">
      @for (link of links; track link.label) {
        <a class="alivet-link text-sm" [href]="link.url">{{ link.label }}</a>
      }
    </nav>
  </div>
</footer>
