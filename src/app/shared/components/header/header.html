<header class="alivet-header">
  <p-menubar [model]="items">
    <ng-template #start>
      <a routerLink="/" class="font-heading text-xl font-bold text-primary no-underline">AliVet</a>
    </ng-template>
    <ng-template #end>
      <a pButton class="min-h-11" routerLink="/login" label="Iniciar sesión" icon="pi pi-sign-in" aria-label="Iniciar sesión" [outlined]="true" [rounded]="true"></a>
      <a
        pButton
        class="min-h-11"
        href="https://wa.me/51932898744"
        target="_blank"
        rel="noopener noreferrer"
        label="Escribir por WhatsApp"
        icon="pi pi-whatsapp"
        [rounded]="true"
        aria-label="Escribir por WhatsApp al 932 898 744"
      ></a>
    </ng-template>
  </p-menubar>
</header>
