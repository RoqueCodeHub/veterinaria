<section id="contacto" class="scroll-mt-24 py-16" aria-labelledby="contacto-title">
  <div class="max-w-6xl mx-auto px-4">
    <div class="bg-sage rounded-[1.75rem] px-6 py-10 md:px-10 md:py-12 grid gap-8 lg:grid-cols-[1.3fr_1fr] lg:items-center">
      <div>
        <h2 id="contacto-title" class="text-3xl md:text-4xl m-0">¿Tu animal necesita atención?</h2>
        <p class="text-muted mt-3 mb-5 max-w-xl">
          Escríbenos por WhatsApp para consultas, visitas a tu finca o pedir productos. Aceptamos Yape, Plin y transferencias.
        </p>
        <div class="flex flex-wrap items-center gap-4">
          <a
            pButton
            class="min-h-11"
            [rounded]="true"
            icon="pi pi-whatsapp"
            label="WhatsApp 932 898 744"
            href="https://wa.me/51932898744"
            target="_blank"
            rel="noopener noreferrer"
          ></a>
          <a routerLink="/contacto" class="alivet-link">Enviar un mensaje</a>
        </div>
      </div>
      <div class="flex flex-wrap gap-3">
        @for (red of redes; track red.id) {
          <a
            pButton
            class="min-h-11"
            [rounded]="true"
            [outlined]="true"
            [label]="red.plataforma"
            [href]="red.url"
            target="_blank"
            rel="noopener noreferrer"
          ></a>
        }
      </div>
    </div>
  </div>
</section>
