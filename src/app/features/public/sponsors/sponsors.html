<section class="py-10" aria-label="Nuestros sponsors">
  <div class="mb-6">
    <p-tag value="Sponsors" />
    <h2 class="text-3xl mt-3 mb-0">Nuestros sponsors</h2>
  </div>
  <div class="grid gap-3 grid-cols-2 md:grid-cols-4">
    @for (s of sponsors; track s.id) {
      <p-card>
        @if (s.imagen) {
          <img class="w-full" [src]="s.imagen" [alt]="s.nombre" />
        } @else {
          <p class="m-0 text-center font-semibold">{{ s.nombre }}</p>
          <p class="m-0 text-center">{{ s.sigla }}</p>
        }
      </p-card>
    }
  </div>
</section>
