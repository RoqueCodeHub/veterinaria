<section appReveal class="max-w-6xl mx-auto px-4 py-12">
  <p class="m-0 mb-4 text-sm text-muted">
    <a routerLink="/" class="alivet-link">Inicio</a>
    <span class="mx-2" aria-hidden="true">/</span>
    <span>Contacto</span>
  </p>
  <p class="m-0 text-xs font-semibold tracking-[0.14em] uppercase text-accent">Escríbenos</p>
  <h1 class="text-3xl md:text-4xl mt-2 mb-3">Escríbenos</h1>
  <p class="m-0 text-muted max-w-2xl">Cuéntanos qué animal necesitas atender o qué producto buscas. Respondemos por WhatsApp.</p>
</section>

<section class="max-w-6xl mx-auto px-4 grid gap-6 lg:grid-cols-2 pb-16">
  <div appReveal class="grid gap-4">
    <p-card>
      <p class="m-0"><i class="pi pi-whatsapp mr-2"></i>WhatsApp</p>
      <a href="https://wa.me/51932898744" target="_blank" rel="noopener">932 898 744</a>
    </p-card>
    <p-card>
      <p class="m-0"><i class="pi pi-clock mr-2"></i>Horario de atención</p>
      <p class="m-0">Lun – Sáb, 9:00 AM – 6:00 PM</p>
    </p-card>
  </div>

  <p-card appReveal header="Mensaje">
    @if (successMsg()) {
      <p-message severity="success" [text]="successMsg()" styleClass="w-full mb-3" />
    }
    @if (errorMsg()) {
      <p-message severity="error" [text]="errorMsg()" styleClass="w-full mb-3" />
    }

    <form class="grid gap-4" (ngSubmit)="onSubmit()">
      <div class="grid gap-4 md:grid-cols-2">
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium" for="ct-nombre">Nombre completo *</label>
          <input pInputText id="ct-nombre" class="w-full" type="text" placeholder="Juan García" [(ngModel)]="form.nombre" name="nombre" required />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium" for="ct-correo">Correo electrónico *</label>
          <input pInputText id="ct-correo" class="w-full" type="email" placeholder="juan@correo.com" [(ngModel)]="form.correo" name="correo" required />
        </div>
      </div>
      <div class="grid gap-4 md:grid-cols-2">
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium" for="ct-celular">Celular</label>
          <input pInputText id="ct-celular" class="w-full" type="tel" placeholder="987 654 321" [(ngModel)]="form.celular" name="celular" maxlength="9" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-sm font-medium" for="ct-asunto">Asunto *</label>
          <input pInputText id="ct-asunto" class="w-full" type="text" placeholder="Consulta sobre un animal o un producto" [(ngModel)]="form.asunto" name="asunto" required />
        </div>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium" for="ct-mensaje">Mensaje *</label>
        <textarea pTextarea id="ct-mensaje" class="w-full" rows="5" placeholder="Escribe tu consulta o comentario aquí..." [(ngModel)]="form.mensaje" name="mensaje" required></textarea>
      </div>
      <p-button type="submit" label="Enviar mensaje" icon="pi pi-send" [loading]="isSubmitting()" [disabled]="isSubmitting()" />
    </form>
  </p-card>
</section>
