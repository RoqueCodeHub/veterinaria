@if (preview()) {
  <section id="galeria" class="scroll-mt-24 py-16" aria-labelledby="gal-title">
    <div class="max-w-6xl mx-auto px-4">
      <p class="m-0 text-xs font-semibold tracking-[0.14em] uppercase text-accent">Nuestro trabajo</p>
      <h2 class="text-3xl md:text-4xl mt-2 mb-3" id="gal-title">Galería Alivet</h2>
      <p class="m-0 text-muted max-w-2xl">Momentos reales de nuestro trabajo en campo y en la clínica.</p>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-8">
        @for (foto of fotosInicio; track foto.src) {
          <img
            class="w-full aspect-[4/3] object-cover rounded-[var(--radius-photo)] bg-sage"
            [src]="toWebp(foto.src)"
            [alt]="foto.alt"
            width="640"
            height="480"
            loading="lazy"
            decoding="async"
          />
        }
      </div>
    </div>
  </section>
} @else {
  <section class="max-w-6xl mx-auto px-4 py-12" aria-labelledby="gal-title">
    <p class="m-0 text-xs font-semibold tracking-[0.14em] uppercase text-accent">Nuestro trabajo</p>
    <h1 class="text-3xl md:text-4xl mt-2 mb-3" id="gal-title">Galería Alivet</h1>
    <p class="m-0 text-muted max-w-2xl">Momentos reales de nuestro trabajo en campo y en la clínica.</p>

    <p-galleria
      class="block mt-8"
      [value]="fotos"
      [numVisible]="5"
      [circular]="true"
      [showThumbnails]="true"
      [showItemNavigators]="true"
      [responsiveOptions]="responsive"
    >
      <ng-template #item let-foto>
        <img class="w-full max-h-[28rem] object-cover" [src]="toWebp(foto.src)" [alt]="foto.alt" />
        <p class="m-0 mt-2">{{ foto.label }}</p>
      </ng-template>
      <ng-template #thumbnail let-foto>
        <img [src]="toWebp(foto.src)" [alt]="foto.alt" />
      </ng-template>
    </p-galleria>
  </section>
}
